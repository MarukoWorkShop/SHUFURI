<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function(){
        try {
          if (localStorage.getItem('shufuri-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/SHUFURI_256.png" />
    <link rel="apple-touch-icon" href="./assets/SHUFURI_256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.tcloudbaseapp.com https://*.tcb-api.tencentcloudapi.com https://*.tcloudbasegateway.com https://*.api.tcloudbasegateway.com https://*.api.tcloudbase.com https://*.tcb.cloud.tencent.com; media-src 'self'; frame-ancestors 'none';"
    />
    <meta name="description" content="SHUFURI — 多语歌词释音与排版助手。支持日语、韩语、英语、中文歌词的发音标注、双语翻译与海报排版导出。" />
    <title>SHUFURI — 多语歌词释音与排版助手</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }
      #app-boot.app-boot--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-boot__spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #e0e0e0;
        border-top-color: #000000;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // JS 超时/失败时勿永久白屏转圈：8s 强制收起 boot
      (function () {
        window.setTimeout(function () {
          var boot = document.getElementById('app-boot');
          if (!boot || boot.classList.contains('app-boot--hide')) return;
          boot.classList.add('app-boot--hide');
          window.setTimeout(function () {
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          }, 400);
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="app-boot" aria-live="polite" aria-busy="true" aria-label="加载中">
      <div class="app-boot__spinner" role="progressbar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
