    <script>
      (function () {
        var GA_ID = 'G-T5EKS33B7S';

          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('js', new Date());

          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        function showBanner() {
          if (document.getElementById('cookie-consent-bar')) return;
          var bar = document.createElement('div');
          bar.id = 'cookie-consent-bar';
          bar.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1f1f1f;color:#fff;padding:14px 18px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.2)');

          text.setAttribute('style', 'flex:1;min-width:200px;line-height:1.5');
          var accept = document.createElement('button');
          accept.textContent = '同意 Agree';
          accept.setAttribute('style', 'background:#10a37f;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px');
          var reject = document.createElement('button');
          reject.textContent = '拒绝 Decline';

          accept.onclick = function () { try { localStorage.setItem('ga_consent', 'accepted'); } catch(e){} bar.remove(); loadGA(); };
          reject.onclick = function () { try { localStorage.setItem('ga_consent', 'rejected'); } catch(e){} bar.remove(); };
          bar.appendChild(text); bar.appendChild(accept); bar.appendChild(reject);
          document.body.appendChild(bar);
        }
        var consent = null;
        try { consent = localStorage.getItem('ga_consent'); } catch(e){}
        if (consent === 'accepted') {
          loadGA();
        } else if (consent !== 'rejected') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', showBanner);
          } else {
            showBanner();
          }
        }
      })();

    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }
      html[data-theme='dark'] #app-boot {
        background: #121212;
      }
      #app-boot.app-boot--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-boot__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 0 28px;
        text-align: center;
      }
      /* KINARI 胶囊加载提示（首屏空白页，不依赖主题 CSS） */
      .app-boot__pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0;
        padding: 12px 22px;
        border-radius: 999px;
        background: #EAE370;
        color: #2B2B1A;
        font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Noto Sans SC', sans-serif;
        letter-spacing: 0.02em;
        box-shadow: 0 1px 2px rgba(43, 43, 26, 0.06);
      }
      .app-boot__pill-text {
        margin: 0;
      }
      /* 与 src/components/PulsatingDots.css 同参：依次脉动 */
      .app-boot__dots {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        --pulsating-dot-color: currentColor;
      }
      .app-boot__dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background-color: var(--pulsating-dot-color);
        display: inline-block;
        animation: pulsating-dots-bounce 1.2s infinite ease-in-out both;
      }
      .app-boot__dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .app-boot__dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulsating-dots-bounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.45;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot__dot {
          animation: none;
          opacity: 0.8;
        }
      }
      .app-boot__reload {
        display: none;
        margin: 0;
        padding: 10px 18px;
        border: 1px solid #ccc;
        border-radius: 999px;
        background: #fff;
        font: 14px/1 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        color: #111;
        cursor: pointer;
      }
      .app-boot__reload.is-visible {
        display: inline-flex;
      }
    </style>
    <script>
      // 慢网超时仅提供刷新入口；勿过早拆掉 boot。真正收起由 hideAppBootLoader 负责。
      (function () {
        window.setTimeout(function () {
          var boot = document.getElementById('app-boot');
          if (!boot || boot.classList.contains('app-boot--hide') || !boot.parentNode) return;
          var reload = boot.querySelector('.app-boot__reload');
          if (reload) reload.classList.add('is-visible');
        }, 20000);
      })();
    </script>

    <div id="app-boot" aria-live="polite" aria-busy="true" aria-label="加载中，请稍候">
      <div class="app-boot__panel">
        <p class="app-boot__pill" role="status">
          <span class="app-boot__pill-text">加载中，请稍候</span>
          <span class="app-boot__dots" aria-hidden="true">
            <span class="app-boot__dot"></span>
            <span class="app-boot__dot"></span>
            <span class="app-boot__dot"></span>
          </span>
        </p>
        <button type="button" class="app-boot__reload" onclick="location.reload()">刷新重试</button>
      </div>
    </div>
